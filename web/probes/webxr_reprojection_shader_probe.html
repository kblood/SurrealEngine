<!doctype html>
<meta charset="utf-8">
<title>Surreal WebXR reprojection shader probe</title>
<canvas id="output" width="256" height="64"></canvas>
<pre id="result">running</pre>
<script src="../webxr_webgl_bridge.js"></script>
<script>
(function () {
	"use strict";
	const resultNode = document.getElementById("result");
	const canvas = document.getElementById("output");
	const gl = canvas.getContext("webgl2", { alpha: false, antialias: false,
		depth: false, stencil: false, preserveDrawingBuffer: true });
	const failures = [], cases = [];
	function fail(message) { failures.push(message); }
	function compile(type, source) {
		const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader);
		if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
		return shader;
	}
	function projection(xScale = 1, yScale = 1, xOffset = 0, yOffset = 0) {
		return [xScale,0,0,0, 0,yScale,0,0, xOffset,yOffset,-1,-1, 0,0,-.2,0];
	}
	function quaternion(axis, degrees) {
		const radians = degrees * Math.PI / 180, sine = Math.sin(radians / 2);
		return { x: axis[0] * sine, y: axis[1] * sine, z: axis[2] * sine,
			w: Math.cos(radians / 2) };
	}
	function normalized(q) {
		const length = Math.hypot(q.x, q.y, q.z, q.w);
		return { x: q.x / length, y: q.y / length, z: q.z / length, w: q.w / length };
	}
	function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
	function rotate(qValue, vector) {
		const q = normalized(qValue), xyz = [q.x, q.y, q.z];
		const t = cross(xyz, vector).map(value => value * 2), c = cross(xyz, t);
		return vector.map((value, index) => value + q.w * t[index] + c[index]);
	}
	function oracle(sourceView, currentView, x, y) {
		const ndc = [(x + .5) / 128 * 2 - 1, (y + .5) / 64 * 2 - 1];
		const cp = currentView.projectionMatrix, sp = sourceView.projectionMatrix;
		let ray = [(cp[8] - ndc[0] * cp[11]) / cp[0],
			(cp[9] - ndc[1] * cp[11]) / cp[5], -1];
		ray = rotate(currentView.transform.orientation, ray);
		const sourceQ = normalized(sourceView.transform.orientation);
		ray = rotate({ x: -sourceQ.x, y: -sourceQ.y, z: -sourceQ.z, w: sourceQ.w }, ray);
		const clipW = sp[11] * ray[2];
		if (!(clipW > 1e-6)) return null;
		const sourceNdc = [(sp[0] * ray[0] + sp[8] * ray[2]) / clipW,
			(sp[5] * ray[1] + sp[9] * ray[2]) / clipW];
		if (sourceNdc.some(value => Math.abs(value) > 1)) return null;
		return sourceNdc.map(value => value * .5 + .5);
	}
	function view(eye, matrix, orientation) { return { eye, projectionMatrix: matrix,
		transform: { orientation, position: { x: 0, y: 0, z: 0 } } }; }
	function atlasColor(eyeIndex, x, y) {
		let color = [Math.min(254, x * 2), Math.min(252, y * 4), eyeIndex ? 211 : 37, 255];
		// Readable, horizontally asymmetric L/R markers catch a mirrored compositor blit.
		const l = eyeIndex === 0 && ((x >= 10 && x <= 15 && y >= 10 && y <= 52) ||
			(x >= 10 && x <= 44 && y >= 10 && y <= 15));
		const r = eyeIndex === 1 && ((x >= 10 && x <= 15 && y >= 10 && y <= 52) ||
			(x >= 10 && x <= 42 && (y >= 47 && y <= 52 || y >= 29 && y <= 34)) ||
			(x >= 37 && x <= 42 && y >= 34 && y <= 47) ||
			(x-y >= 0 && x-y <= 6 && y >= 10 && y <= 29));
		if (l) color = [255, 40, 220, 255];
		if (r) color = [30, 255, 255, 255];
		return color;
	}
	try {
		if (!gl) throw new Error("WebGL2 unavailable");
		const sources = SurrealWebXRWebGLBridge.reprojectionShaderSources();
		const program = gl.createProgram();
		gl.attachShader(program, compile(gl.VERTEX_SHADER, sources.vertex));
		gl.attachShader(program, compile(gl.FRAGMENT_SHADER, sources.fragment));
		gl.linkProgram(program);
		if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
		gl.useProgram(program); gl.bindVertexArray(gl.createVertexArray());
		const uniforms = Object.fromEntries(["atlas", "uvRect", "atlasSize", "reprojectEnabled",
			"currentProjection", "currentProjectionW", "sourceProjection", "sourceProjectionW",
			"currentToSource"].map(name => [name, gl.getUniformLocation(program, name)]));
		const pixels = new Uint8Array(256 * 64 * 4);
		for (let y = 0; y < 64; y++) for (let x = 0; x < 256; x++)
			pixels.set(atlasColor(x >= 128 ? 1 : 0, x % 128, y), (y * 256 + x) * 4);
		const texture = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texture);
		gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
		gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
		gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
		gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
		gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
		gl.uniform1i(uniforms.atlas, 0); gl.uniform2f(uniforms.atlasSize, 256, 64);
		function configure(eyeIndex, sourceView, currentView, enabled) {
			gl.viewport(eyeIndex * 128, 0, 128, 64);
			gl.uniform4f(uniforms.uvRect, eyeIndex * .5, 0, (eyeIndex + 1) * .5, 1);
			gl.uniform1i(uniforms.reprojectEnabled, enabled ? 1 : 0);
			if (!enabled) return;
			const reprojection = SurrealWebXRWebGLBridge.createRotationReprojection(sourceView, currentView);
			if (!reprojection) throw new Error("probe supplied invalid reprojection metadata");
			const cp = reprojection.currentProjection, sp = reprojection.sourceProjection;
			gl.uniform4f(uniforms.currentProjection, cp[0], cp[1], cp[2], cp[3]);
			gl.uniform1f(uniforms.currentProjectionW, cp[4]);
			gl.uniform4f(uniforms.sourceProjection, sp[0], sp[1], sp[2], sp[3]);
			gl.uniform1f(uniforms.sourceProjectionW, sp[4]);
			gl.uniformMatrix3fv(uniforms.currentToSource, false, new Float32Array(reprojection.currentToSource));
		}
		function draw(eyeIndex, sourceView, currentView, enabled = true) {
			configure(eyeIndex, sourceView, currentView, enabled); gl.drawArrays(gl.TRIANGLES, 0, 3);
		}
		function read(x, y) { const value = new Uint8Array(4); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, value); return Array.from(value); }
		function expected(eyeIndex, sourceView, currentView, x, y, enabled = true) {
			const uv = enabled ? oracle(sourceView, currentView, x, y) : [(x + .5) / 128, (y + .5) / 64];
			if (!uv) return [0, 0, 0, 255];
			const sx = Math.max(0, Math.min(127, Math.floor(uv[0] * 128)));
			const sy = Math.max(0, Math.min(63, Math.floor(uv[1] * 64)));
			return atlasColor(eyeIndex, sx, sy);
		}
		function check(name, eyeIndex, sourceView, currentView, samples, enabled = true) {
			gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); draw(eyeIndex, sourceView, currentView, enabled);
			for (const [x, y] of samples) {
				const actual = read(eyeIndex * 128 + x, y), wanted = expected(eyeIndex, sourceView, currentView, x, y, enabled);
				if (actual.some((value, index) => Math.abs(value - wanted[index]) > 2))
					fail(name + " @" + x + "," + y + " got " + actual + " expected " + wanted);
			}
			cases.push(name);
		}
		const identity = { x: 0, y: 0, z: 0, w: 1 };
		const leftIdentity = view("left", projection(1.2, .9, -.13, .08), identity);
		const rightIdentity = view("right", projection(.95, 1.1, .17, -.06), identity);
		const samples = [[0,0], [10,12], [14,40], [43,12], [63,31], [96,48], [127,63]];
		check("identity-readable-left-no-mirror", 0, leftIdentity, leftIdentity, samples);
		check("identity-readable-right-no-mirror", 1, rightIdentity, rightIdentity, samples);
		check("asymmetric-left", 0, view("left", projection(1.15,.92,-.2,.12), identity),
			view("left", projection(1.08,.98,.09,-.11), identity), [[30,20],[64,32],[92,45]]);
		check("asymmetric-right", 1, view("right", projection(.98,1.13,.22,-.09), identity),
			view("right", projection(1.04,1.02,-.08,.07), identity), [[34,18],[66,31],[90,44]]);
		for (const [name, q] of [["yaw", quaternion([0,1,0], 8)], ["pitch", quaternion([1,0,0], -7)],
			["roll", quaternion([0,0,1], 9)], ["compound", normalized({x:.13,y:-.19,z:.08,w:.96})]])
			check(name, 0, view("left", projection(), identity), view("left", projection(), q), [[40,20],[64,32],[85,43]]);
		const q = normalized({x:.11,y:-.16,z:.07,w:.97}), qNeg = {x:-q.x,y:-q.y,z:-q.z,w:-q.w};
		check("quaternion-q", 0, view("left", projection(), identity), view("left", projection(), q), [[44,21],[70,38]]);
		const qPixels = [read(44,21), read(70,38)];
		check("quaternion-minus-q", 0, view("left", projection(), identity), view("left", projection(), qNeg), [[44,21],[70,38]]);
		if (JSON.stringify(qPixels) !== JSON.stringify([read(44,21), read(70,38)])) fail("q/-q framebuffer mismatch");
		for (const degrees of [90,120,180]) check("behind-" + degrees, 0,
			view("left", projection(), identity), view("left", projection(), quaternion([0,1,0], degrees)), [[64,32]]);
		check("atlas-right-border-no-left-bleed", 0,
			view("left", projection(1,1,-.006,0), identity), view("left", projection(), identity), [[127,32]]);
		gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
		draw(0, view("left", projection(), identity), view("left", projection(), quaternion([0,1,0], 6)), true);
		draw(1, rightIdentity, rightIdentity, false);
		for (const [eyeIndex, sourceView, currentView, enabled, point] of [
			[0, view("left", projection(), identity), view("left", projection(), quaternion([0,1,0], 6)), true, [64,32]],
			[1, rightIdentity, rightIdentity, false, [14,40]]]) {
			const actual = read(eyeIndex * 128 + point[0], point[1]);
			const wanted = expected(eyeIndex, sourceView, currentView, point[0], point[1], enabled);
			if (JSON.stringify(actual) !== JSON.stringify(wanted)) fail("partial fallback eye " + eyeIndex);
		}
		cases.push("partial-one-eye-fallback");
		const error = gl.getError(); if (error !== gl.NO_ERROR) fail("WebGL error " + error);
		window.probeResult = { ok: failures.length === 0, cases, failures,
			note: "Shader/readback test only; immersive WebXR entry requires a connected headset." };
	} catch (error) {
		window.probeResult = { ok: false, cases, failures: failures.concat(String(error && error.stack || error)),
			note: "Shader/readback test only; immersive WebXR entry requires a connected headset." };
	}
	resultNode.textContent = JSON.stringify(window.probeResult, null, 2);
})();
</script>
