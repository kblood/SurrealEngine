<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGPU canvas to WebGL 2 bridge probe</title>
</head>
<body>
<canvas id="webgpu-source" width="512" height="256"></canvas>
<canvas id="webgl-destination" width="512" height="256"></canvas>
<pre id="result">running</pre>
<script type="module">
const source = document.getElementById("webgpu-source");
const destination = document.getElementById("webgl-destination");
const output = document.getElementById("result");

function percentile(sorted, fraction) {
  return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * fraction))];
}

function compileShader(gl, type, sourceText) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, sourceText);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

async function runProbe() {
  if (!navigator.gpu) throw new Error("WebGPU is unavailable");
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error("requestAdapter returned null");
  const device = await adapter.requestDevice();
  const gpu = source.getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  gpu.configure({ device, format, alphaMode: "opaque" });

  const shader = device.createShaderModule({ code: `
    @vertex fn vertexMain(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
      var positions = array<vec2f, 3>(
        vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
      return vec4f(positions[i], 0.0, 1.0);
    }
    @fragment fn fragmentMain(@builtin(position) p: vec4f) -> @location(0) vec4f {
      if (p.x < 256.0) { return vec4f(1.0, 0.0, 0.0, 1.0); }
      return vec4f(0.0, 1.0, 0.0, 1.0);
    }
  ` });
  const pipeline = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: shader, entryPoint: "vertexMain" },
    fragment: { module: shader, entryPoint: "fragmentMain", targets: [{ format }] },
    primitive: { topology: "triangle-list" }
  });
  function renderAtlas() {
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({ colorAttachments: [{
      view: gpu.getCurrentTexture().createView(),
      clearValue: { r: 0, g: 0, b: 0, a: 1 },
      loadOp: "clear",
      storeOp: "store"
    }] });
    pass.setPipeline(pipeline);
    pass.draw(3);
    pass.end();
    device.queue.submit([encoder.finish()]);
  }

  const gl = destination.getContext("webgl2", {
    alpha: false,
    antialias: false,
    preserveDrawingBuffer: true
  });
  if (!gl) throw new Error("WebGL 2 is unavailable");
  const vertex = compileShader(gl, gl.VERTEX_SHADER, `#version 300 es
    const vec2 positions[3] = vec2[3](vec2(-1., -1.), vec2(3., -1.), vec2(-1., 3.));
    out vec2 uv;
    void main() { vec2 p = positions[gl_VertexID]; gl_Position = vec4(p, 0., 1.); uv = p * .5 + .5; }
  `);
  const fragment = compileShader(gl, gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    uniform sampler2D atlas;
    in vec2 uv;
    out vec4 color;
    void main() { color = texture(atlas, uv); }
  `);
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, source.width, source.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

  // Warm up cross-API upload and shader compilation before measuring.
  for (let i = 0; i < 10; i++) {
    await new Promise(requestAnimationFrame);
    renderAtlas();
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
  }

  const timings = [];
  for (let i = 0; i < 60; i++) {
    await new Promise(requestAnimationFrame);
    renderAtlas();
    const start = performance.now();
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    timings.push(performance.now() - start);
  }

  const left = new Uint8Array(4);
  const right = new Uint8Array(4);
  gl.readPixels(128, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, left);
  gl.readPixels(384, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, right);
  const valid = left[0] > 240 && left[1] < 15 && right[1] > 240 && right[0] < 15;
  const error = gl.getError();
  timings.sort((a, b) => a - b);

  return {
    supported: true,
    valid,
    width: source.width,
    height: source.height,
    iterations: timings.length,
    medianHandoffDrawFinishMs: percentile(timings, 0.5),
    p95HandoffDrawFinishMs: percentile(timings, 0.95),
    left: Array.from(left),
    right: Array.from(right),
    glError: error,
    caveat: "HTMLCanvasElement upload is specified; zero-copy is not. Each timing starts after WebGPU submission and includes synchronization, texSubImage2D, one quad, and gl.finish."
  };
}

try {
  window.bridgeProbeResult = await runProbe();
} catch (error) {
  window.bridgeProbeResult = { supported: false, error: String(error), stack: error?.stack ?? "" };
}
output.textContent = JSON.stringify(window.bridgeProbeResult, null, 2);
</script>
</body>
</html>
