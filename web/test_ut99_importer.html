<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SurrealEngine UT99 importer tests</title>
</head>
<body>
<pre id="results">running</pre>
<script src="ut99_importer.js"></script>
<script>
"use strict";

window.importerTestResults = [];
window.importerTestDone = false;

function record(name, passed, detail) {
	window.importerTestResults.push({ name: name, passed: !!passed, detail: detail || "" });
}

function assert(condition, message) {
	if (!condition) throw new Error(message || "assertion failed");
}

async function expectError(code, callback) {
	try {
		await callback();
	} catch (error) {
		assert(error && error.code === code, "expected " + code + ", got " + (error && error.code));
		return error;
	}
	throw new Error("expected " + code + " to be thrown");
}

function syntheticEntries() {
	const files = [
		["System/Core.u", "fake-core"],
		["System/Engine.u", "fake-engine"],
		["System/Botpack.u", "fake-botpack"],
		["System/UnrealShare.u", "fake-shared-unreal-package"],
		["System/UnrealTournament.ini", "[fake-test-config]"],
		["System/UnrealTournament.exe", "fake-executable-not-runnable"],
		["Maps/DM-Synthetic.unr", "fake-map"],
		["Textures/Synthetic.utx", "fake-texture"],
		["Sounds/Synthetic.uax", "fake-sound"],
		["Music/Synthetic.umx", "fake-music"],
	];
	return files.map(item => {
		const blob = new Blob([item[1]], { type: "application/octet-stream" });
		return { path: item[0], size: blob.size, getBlob: async () => blob };
	});
}

function syntheticUnrealGoldEntries() {
	const files = [
		["System/Core.u", "fake-core"],
		["System/Engine.u", "fake-engine"],
		["System/UnrealShare.u", "fake-share"],
		["System/UnrealI.u", "fake-unreali"],
		["System/Unreal.ini", "[fake-test-config]"],
		["System/Unreal.exe", "fake-executable-not-runnable"],
		["Maps/Vortex2.unr", "fake-map"],
		["Maps/NyLeve.unr", "fake-map-two"],
		["Textures/Synthetic.utx", "fake-texture"],
		["Sounds/Synthetic.uax", "fake-sound"],
		["Music/Synthetic.umx", "fake-music"],
	];
	return files.map(item => {
		const blob = new Blob([item[1]], { type: "application/octet-stream" });
		return { path: item[0], size: blob.size, getBlob: async () => blob };
	});
}

class FakeFS {
	constructor(preloaded) {
		this.directories = new Set(["/"]);
		this.files = new Map();
		if (preloaded) {
			for (const path of ["/gamedata/System/Core.u", "/gamedata/System/Engine.u", "/gamedata/System/Botpack.u", "/gamedata/System/UnrealTournament.exe"]) {
				this.files.set(path, new Uint8Array([1]));
			}
		}
	}
	mkdirTree(path) { this.directories.add(path); }
	analyzePath(path) { return { exists: this.directories.has(path) || this.files.has(path) }; }
	open(path) { return { path: path, bytes: new Uint8Array(0) }; }
	write(handle, source, offset, length, position) {
		const required = position + length;
		if (handle.bytes.byteLength < required) {
			const expanded = new Uint8Array(required);
			expanded.set(handle.bytes);
			handle.bytes = expanded;
		}
		handle.bytes.set(source.subarray(offset, offset + length), position);
		return length;
	}
	close(handle) { this.files.set(handle.path, handle.bytes); }
}

async function run(name, callback) {
	try {
		await callback();
		record(name, true);
	} catch (error) {
		record(name, false, error && (error.stack || error.message) || String(error));
	}
}

window.importerTestPromise = (async function () {
	const api = window.SurrealUT99Importer;

	await run("schema is explicit and versioned", async () => {
		assert(api.SCHEMA_NAME === "surrealengine-ut99-data");
		assert(api.SCHEMA_VERSION === 1);
	});

	await run("unexpected browser failures retain a safe phase and actionable code", async () => {
		const secret = "C:\\private-game-folder\\System\\Core.u";
		const quota = api.normalizeImportFailure(new DOMException(secret, "QuotaExceededError"), "storage-copy");
		assert(quota.code === "QUOTA_RUNTIME");
		assert(quota.details.phase === "storage-copy" && quota.details.underlyingName === "QuotaExceededError");
		assert(!quota.message.includes(secret) && !JSON.stringify(quota.details).includes(secret), "private path leaked into diagnostics");
		const memory = api.normalizeImportFailure(new RangeError("WebAssembly.Memory.grow(): Maximum memory size exceeded"), "runtime-copy");
		assert(memory.code === "OUT_OF_MEMORY" && memory.message.includes("preparing files for the game runtime"));
		const interrupted = api.normalizeImportFailure(new DOMException("transaction aborted", "AbortError"), "storage-copy");
		assert(interrupted.code === "STORAGE_INTERRUPTED", "storage abort was mistaken for picker cancellation");
		const expected = api.normalizeImportFailure(new api.ImportError("EXPECTED", "safe", { marker: true }), "validation");
		assert(expected.code === "EXPECTED" && expected.details.marker && expected.details.phase === "validation");
		assert(api.safeMessage(new Error(secret), "folder-scan").includes("IMPORT_FAILED; phase: folder-scan"));
		assert(!api.safeMessage(new Error(secret), "folder-scan").includes(secret), "private path leaked through fallback message");
	});

	await run("typed importer failures survive duplicate-script or cross-realm boundaries", async () => {
		const foreignFailure = {
			name: "SurrealUT99ImportError",
			code: "FILE_NOT_READABLE",
			message: "The selected game file could not be read.",
			details: { marker: true },
		};
		const normalized = api.normalizeImportFailure(foreignFailure, "folder-scan");
		assert(normalized instanceof api.ImportError, "foreign typed failure was not localized");
		assert(normalized.code === "FILE_NOT_READABLE" && normalized.details.marker);
		assert(normalized.details.phase === "folder-scan" && normalized.details.underlyingName === "ImportError");
		assert(api.safeMessage(normalized).endsWith("[Diagnostic: FILE_NOT_READABLE; phase: folder-scan]"));
	});

	await run("folder-picker failures are normalized instead of showing a generic error", async () => {
		const secret = "C:\\private-game-folder\\System\\Core.u";
		const logs = [];
		const controller = new api.ImportController({ FS: new FakeFS(false) }, {
			log: value => logs.push(value),
		});
		controller._handleImportError(new DOMException(secret, "NotReadableError"), "folder-scan");
		assert(controller.lastError.code === "FILE_NOT_READABLE");
		assert(controller.lastError.details.phase === "folder-scan");
		assert(controller.lastError.message.includes("reading the selected folder"));
		assert(!logs.join("\n").includes(secret), "private path leaked into folder-scan log");
	});

	await run("validates synthetic UT99 layout without reading contents", async () => {
		let reads = 0;
		const entries = syntheticEntries().map(entry => ({
			path: entry.path,
			size: entry.size,
			getBlob: async () => { reads++; return entry.getBlob(); },
		}));
		const validation = api.validateEntries(entries);
		assert(validation.fileCount === entries.length);
		assert(validation.totalBytes > 0);
		assert(validation.gameId === "ut99", "shared Unreal packages overrode title-specific UT markers");
		assert(reads === 0, "validation read file contents");
	});

	await run("detects and strictly validates synthetic Unreal Gold data", async () => {
		const validation = api.validateEntries(syntheticUnrealGoldEntries());
		assert(validation.gameId === "unreal-gold");
		assert(validation.game === api.GAME_DEFINITIONS["unreal-gold"]);
		const incomplete = syntheticUnrealGoldEntries().filter(entry => entry.path !== "System/UnrealI.u");
		const error = await expectError("MISSING_GAME_DATA", async () => api.validateEntries(incomplete));
		assert(error.message.includes("System/UnrealI.u"));
	});

	await run("Unreal Gold map manifest accepts safe campaign map names", async () => {
		const entries = syntheticUnrealGoldEntries();
		const metadata = {
			schema: api.SCHEMA_NAME, version: api.SCHEMA_VERSION, datasetId: "unreal-gold-test", gameId: "unreal-gold",
			fileCount: entries.length, totalBytes: entries.reduce((sum, entry) => sum + entry.size, 0),
			files: entries.map(entry => ({ path: entry.path, size: entry.size })),
		};
		const manifest = api.mapManifestFromMetadata(metadata, "ready");
		assert(manifest.gameId === "unreal-gold");
		assert(manifest.maps.join(",") === "NyLeve,Vortex2", manifest.maps.join(","));
		assert(api.selectLaunchMap(manifest, "vortex2") === "Vortex2");
	});

	await run("legacy version-one metadata remains UT99-compatible", async () => {
		const entries = syntheticEntries();
		const metadata = {
			schema: api.SCHEMA_NAME, version: api.SCHEMA_VERSION, datasetId: "legacy-ut99-test",
			fileCount: entries.length, totalBytes: entries.reduce((sum, entry) => sum + entry.size, 0),
			files: entries.map(entry => ({ path: entry.path, size: entry.size })),
		};
		assert(api.validateMetadata(metadata) === metadata);
		assert(api.mapManifestFromMetadata(metadata, "ready").gameId === "ut99");
	});

	await run("reports actionable missing-file errors", async () => {
		const error = await expectError("MISSING_UT99_DATA", async () => api.validateEntries([
			{ path: "System/Core.u", size: 1, getBlob: async () => new Blob(["x"]) },
		]));
		assert(error.message.includes("System/Engine.u"));
		assert(error.message.includes("Select the folder"));
	});

	await run("rejects traversal and case-colliding paths", async () => {
		await expectError("INVALID_PATH", async () => api.canonicalizeRelativePath("../secret"));
		const duplicate = syntheticEntries();
		duplicate.push({ path: "system/core.u", size: 1, getBlob: async () => new Blob(["x"]) });
		await expectError("DUPLICATE_PATH", async () => api.validateEntries(duplicate));
	});

	await run("directory-input fallback strips only the selected root", async () => {
		const files = syntheticEntries().map(entry => {
			const file = new File(["x"], entry.path.split("/").pop());
			Object.defineProperty(file, "webkitRelativePath", { value: "UnrealTournament/" + entry.path });
			return file;
		});
		const entries = api.entriesFromFileList(files);
		assert(entries[0].path === "System/Core.u");
		assert(api.validateEntries(entries).fileCount === files.length);
	});

	await run("directory picker recursively retains the complete game layout", async () => {
		const tree = new Map();
		for (const entry of syntheticEntries()) {
			const parts = entry.path.split("/");
			const directory = parts.shift();
			if (!tree.has(directory)) tree.set(directory, []);
			tree.get(directory).push({
				kind: "file",
				name: parts.join("/"),
				getFile: async () => new File([await entry.getBlob()], parts.join("/")),
			});
		}
		const root = {
			kind: "directory",
			async *values() {
				for (const [name, files] of tree) {
					yield { kind: "directory", name, async *values() { for (const file of files) yield file; } };
				}
			},
		};
		const progress = [];
		const entries = await api.entriesFromDirectoryHandle(root, value => progress.push(value));
		assert(api.validateEntries(entries).fileCount === syntheticEntries().length);
		assert(progress.at(-1).filesDone === syntheticEntries().length);
	});

	const databaseName = "surrealengine-importer-test-" + Date.now() + "-" + Math.random();
	const idbStorage = new api.IndexedDBStorage(databaseName);
	const validation = api.validateEntries(syntheticEntries());

	await run("IndexedDB fallback saves and restores fake files", async () => {
		await idbStorage.clear();
		const progress = [];
		const metadata = await idbStorage.save(validation, value => progress.push(value));
		assert(metadata.backend === "indexeddb");
		assert(progress.length > 0 && progress[progress.length - 1].filesDone === validation.fileCount);
		const restored = await idbStorage.load();
		assert(restored.metadata.fileCount === validation.fileCount);
		const blob = await restored.getBlob("System/Core.u");
		assert(await blob.text() === "fake-core");
	});

	await run("streams a restored dataset into the Emscripten FS gate", async () => {
		const restored = await idbStorage.load();
		const fs = new FakeFS(false);
		const progress = [];
		await api.materializeDataset(fs, restored, value => progress.push(value));
		assert(new TextDecoder().decode(fs.files.get("/gamedata/System/Core.u")) === "fake-core");
		assert(progress[progress.length - 1].bytesDone === validation.totalBytes);
	});

	await run("missing optional OPFS export falls back without calling ccall", async () => {
		let ccallCount = 0;
		const Module = {
			ccall() {
				ccallCount++;
				throw new Error("missing export");
			},
		};
		assert(api.supportsOPFSMount(Module) === false);
		assert(ccallCount === 0, "missing export was probed through ccall");
	});

	await run("OPFS support uses the directly exported ABI probe", async () => {
		let ccallCount = 0;
		const Module = {
			_Surreal_GetBrowserOPFSMountABIVersion: () => 1,
			ccall() { ccallCount++; },
		};
		assert(api.supportsOPFSMount(Module) === true);
		assert(ccallCount === 0, "ABI probe unexpectedly used ccall");
	});

	await run("experimental OPFS runtime registers metadata without reading blobs", async () => {
		const restored = await idbStorage.load();
		let blobReads = 0;
		const calls = [];
		const Module = {
			FS: new FakeFS(false),
			_Surreal_GetBrowserOPFSMountABIVersion: () => 1,
			ccall(name, returnType, argumentTypes, args) {
				calls.push({ name, args: (args || []).slice() });
				return 1;
			},
		};
		const dataset = {
			metadata: restored.metadata,
			mount: { type: "wasmfs-opfs-v1", storageDirectory: "synthetic-opfs", datasetId: restored.metadata.datasetId },
			getBlob: async path => { blobReads++; return restored.getBlob(path); },
		};
		const prepared = await api.prepareRuntimeDataset(Module, dataset);
		assert(prepared.mode === "opfs-mount");
		assert(blobReads === 0, "OPFS mount preparation read file contents");
		assert(calls[0].name === "Surreal_BeginBrowserOPFSMount" && calls[0].args[2] === restored.metadata.fileCount);
		const additions = calls.filter(call => call.name === "Surreal_AddBrowserOPFSMountFile");
		assert(additions.length === restored.metadata.fileCount);
		assert(additions.some(call => call.args[0] === "System/Core.u"));
		assert(Module.FS.files.size === 0, "mount preparation materialized data in MEMFS");
	});

	await run("Window-owned OPFS runtime awaits native Asyncify preparation", async () => {
		const restored = await idbStorage.load();
		const calls = [];
		const Module = {
			FS: new FakeFS(false),
			_Surreal_GetBrowserOPFSMountABIVersion: () => 2,
			_Surreal_GetBrowserOPFSMountMode: () => 2,
			ccall(name, returnType, argumentTypes, args, options) {
				calls.push({ name, args: (args || []).slice(), options });
				if (name === "Surreal_PrepareBrowserOPFSMount") return Promise.resolve(1);
				return 1;
			},
		};
		const dataset = {
			metadata: restored.metadata,
			mount: { type: "wasmfs-opfs-v1", storageDirectory: "synthetic-opfs", datasetId: restored.metadata.datasetId },
			getBlob: async () => { throw new Error("Asyncify preparation must not read a blob"); },
		};
		const prepared = await api.prepareRuntimeDataset(Module, dataset);
		assert(prepared.mode === "opfs-mount");
		const nativePrepare = calls.find(call => call.name === "Surreal_PrepareBrowserOPFSMount");
		assert(nativePrepare && nativePrepare.options && nativePrepare.options.async === true,
			"native mount preparation was not awaited through Asyncify");
		assert(calls.indexOf(nativePrepare) > calls.findIndex(call => call.name === "Surreal_AddBrowserOPFSMountFile"),
			"native mount preparation ran before its manifest was registered");
	});

	await run("developer preload bypasses persistence and launches once", async () => {
		let storageLoads = 0;
		let launches = 0;
		const order = [];
		const storage = { backend: "test", load: async () => { storageLoads++; return null; }, clear: async () => {} };
		const controller = new api.ImportController({ FS: new FakeFS(true) }, {
			storage: storage,
			beforeLaunch: async mode => { await Promise.resolve(); order.push("before:" + mode); },
			launch: mode => { order.push("launch:" + mode); launches++; },
		});
		const result = await controller.initialize();
		assert(result.mode === "developer-preload");
		assert(storageLoads === 0, "preload path touched persistence");
		assert(launches === 1);
		assert(order.join(",") === "before:developer-preload,launch:developer-preload",
			"beforeLaunch did not finish before launch: " + order.join(","));
		const manifest = controller.mapManifest();
		assert(manifest.schema === api.MAP_MANIFEST_SCHEMA && manifest.version === 1);
		assert(manifest.state === "unavailable" && manifest.maps.length === 0);
		assert(Object.isFrozen(manifest) && Object.isFrozen(manifest.maps));
	});

	await run("developer preload detects Unreal Gold without touching persistence", async () => {
		const fs = new FakeFS(false);
		for (const path of ["/gamedata/System/Core.u", "/gamedata/System/Engine.u", "/gamedata/System/UnrealShare.u", "/gamedata/System/UnrealI.u", "/gamedata/System/Unreal.exe"]) {
			fs.files.set(path, new Uint8Array([1]));
		}
		assert(api.developerPreloadGame(fs) === "unreal-gold");
		let context = null;
		const controller = new api.ImportController({ FS: fs }, { launch: (_mode, value) => { context = value; } });
		await controller.initialize();
		assert(context.mapManifest.gameId === "unreal-gold" && context.metadata === null);
	});

	await run("no-data build waits until a validated import is materialized", async () => {
		let launches = 0;
		const fs = new FakeFS(false);
		const storage = new api.IndexedDBStorage(databaseName + "-gate");
		const controller = new api.ImportController({ FS: fs }, { storage: storage, launch: () => launches++ });
		const waiting = await controller.initialize();
		assert(waiting.state === "waiting-for-import");
		assert(launches === 0, "main gate opened before import");
		controller._handleImportError(new DOMException("previous read failure", "NotReadableError"), "folder-scan");
		assert(controller.lastError.code === "FILE_NOT_READABLE");
		await controller.importEntries(syntheticEntries());
		assert(launches === 1);
		assert(controller.lastError === null, "successful retry retained a stale import error");
		assert(fs.files.has("/gamedata/Maps/DM-Synthetic.unr"));
		await storage.clear();
	});

	await run("controller reports the failed import phase without logging browser exception text", async () => {
		const secret = "C:\\private-game-folder\\System\\Core.u";
		const logs = [];
		const storage = {
			backend: "test",
			load: async () => null,
			clear: async () => {},
			save: async () => { throw new DOMException(secret, "QuotaExceededError"); },
		};
		const controller = new api.ImportController({ FS: new FakeFS(false) }, { storage, log: value => logs.push(value) });
		await controller.initialize();
		const failure = await expectError("QUOTA_RUNTIME", () => controller.importEntries(syntheticEntries()));
		assert(failure.details.phase === "storage-copy");
		assert(controller.lastError === failure);
		assert(logs.some(line => line.includes("storage-copy (QUOTA_RUNTIME; QuotaExceededError)")));
		assert(!logs.join("\n").includes(secret), "private path leaked into log");
	});

	await run("new-import startup failures preserve the saved import", async () => {
		const storage = new api.IndexedDBStorage(databaseName + "-new-startup-failure");
		await storage.clear();
		const statuses = [];
		const controller = new api.ImportController({ FS: new FakeFS(false) }, {
			storage,
			launch: async () => { throw new Error("native startup failed"); },
		});
		controller.ui.setStatus = message => statuses.push(message);
		const waiting = await controller.initialize();
		assert(waiting.state === "waiting-for-import");
		const failure = await expectError("STARTUP_FAILED", () => controller.importEntries(syntheticEntries()));
		assert(failure.details.phase === "startup", "startup exception was mislabeled as an import phase");
		assert(failure.message.includes("imported or restored successfully"));
		assert(!failure.message.toLowerCase().includes("clear"), "valid saved data was presented as disposable");
		assert(statuses.at(-1).includes("imported and saved") && statuses.at(-1).includes("could not start"));
		assert((await storage.load()).metadata.fileCount === syntheticEntries().length, "startup failure removed the saved import");
		await storage.clear();
	});

	await run("restored-import startup failures remain distinct from restore failures", async () => {
		const storage = new api.IndexedDBStorage(databaseName + "-restored-startup-failure");
		await storage.clear();
		await storage.save(api.validateEntries(syntheticEntries()));
		const statuses = [];
		const controller = new api.ImportController({ FS: new FakeFS(false) }, {
			storage,
			launch: async () => { throw new Error("native startup failed"); },
		});
		controller.ui.setStatus = message => statuses.push(message);
		const result = await controller.initialize();
		assert(result.state === "startup-failed" && result.mode === "persistent-import");
		assert(result.error.code === "STARTUP_FAILED" && result.error.details.phase === "startup");
		assert(!result.error.message.toLowerCase().includes("clear"), "restored data was presented as disposable");
		assert(statuses.at(-1).includes("were restored") && statuses.at(-1).includes("could not start"));
		assert(controller.mapManifest().state === "ready", "startup failure invalidated restored metadata");
		assert((await storage.load()).metadata.fileCount === syntheticEntries().length, "startup failure cleared restored data");
		await storage.clear();
	});

	await run("map manifest exposes only immutable safe direct map basenames", async () => {
		const extras = [
			["Maps/CTF-Face.unr", "ctf"],
			["Maps/AS-HiSpeed.unr", "assault"],
			["Maps/DOM-Cinder.unr", "domination"],
			["Maps/DM-Upper.UNR", "uppercase-extension"],
			["Maps/MH-Unsupported.unr", "unsupported-prefix"],
			["Maps/DM-Bad?game=Evil.unr", "query-like"],
			["Maps/Subdirectory/DM-Nested.unr", "nested"],
		].map(item => {
			const blob = new Blob([item[1]], { type: "application/octet-stream" });
			return { path: item[0], size: blob.size, getBlob: async () => blob };
		});
		const storage = new api.IndexedDBStorage(databaseName + "-map-manifest");
		await storage.clear();
		const controller = new api.ImportController({ FS: new FakeFS(false) }, {
			storage: storage,
			launch: () => {},
		});
		const waiting = await controller.initialize();
		assert(waiting.state === "waiting-for-import");
		assert(controller.mapManifest().state === "empty");
		await controller.importEntries(syntheticEntries().concat(extras));
		const first = controller.mapManifest();
		const second = controller.mapManifest();
		assert(first !== second && first.maps !== second.maps, "manifest did not return a copy snapshot");
		assert(Object.isFrozen(first) && Object.isFrozen(first.maps), "manifest snapshot is mutable");
		assert(first.state === "ready");
		assert(first.maps.join(",") === "AS-HiSpeed,CTF-Face,DM-Synthetic,DM-Upper,DOM-Cinder",
			"unexpected safe map inventory: " + first.maps.join(","));
		assert(first.rejectedCount === 3, "unsafe/nested map candidates were not rejected");
		assert(!JSON.stringify(first).includes("Maps/") && !JSON.stringify(first).includes(".unr"),
			"manifest exposed a relative path or extension");
		const cleared = await controller.clearSavedImport();
		assert(cleared.state === "cleared" && cleared.maps.length === 0);
		assert(controller.mapManifest().state === "cleared");
		assert(await storage.load() === null);
	});

	await run("safe map selection uses only manifest entries or a validated preload name", async () => {
		const ready = api.mapManifestFromMetadata({
			schema: api.SCHEMA_NAME,
			version: api.SCHEMA_VERSION,
			datasetId: "map-selection-test",
			files: syntheticEntries().concat([
				{ path: "Maps/CTF-Face.unr", size: 1, getBlob: async () => new Blob(["x"]) },
			]).map(entry => ({ path: entry.path, size: entry.size })),
			fileCount: syntheticEntries().length + 1,
			totalBytes: syntheticEntries().reduce((total, entry) => total + entry.size, 0) + 1,
		}, "ready");
		assert(api.selectLaunchMap(ready, "ctf-face") === "CTF-Face");
		assert(api.selectLaunchMap(ready, "DM-NotImported") === "CTF-Face");
		const preload = Object.freeze({ schema: api.MAP_MANIFEST_SCHEMA, version: api.MAP_MANIFEST_VERSION,
			state: "unavailable", maps: Object.freeze([]), rejectedCount: 0 });
		assert(api.selectLaunchMap(preload, "DM-Deck16][") === "DM-Deck16][");
		await expectError("MAP_SELECTION", () => api.selectLaunchMap(preload, "../DM-Deck16]["));
	});

	await run("saved import reopens the boot gate on a later load", async () => {
		let launches = 0;
		const fs = new FakeFS(false);
		const controller = new api.ImportController({ FS: fs }, { storage: idbStorage, launch: mode => { assert(mode === "persistent-import"); launches++; } });
		const result = await controller.initialize();
		assert(result.mode === "persistent-import");
		assert(launches === 1);
		assert(fs.files.has("/gamedata/System/Botpack.u"));
		assert(controller.mapManifest().maps.join(",") === "DM-Synthetic");
	});

	await run("re-import replaces persistence without mutating the live FS", async () => {
		let replacements = 0;
		const fs = new FakeFS(false);
		const storage = {
			backend: "test",
			save: async value => ({
				schema: api.SCHEMA_NAME,
				version: api.SCHEMA_VERSION,
				datasetId: "replacement",
				createdAt: new Date().toISOString(),
				backend: "test",
				fileCount: value.fileCount,
				totalBytes: value.totalBytes,
				files: value.entries.map(entry => ({ path: entry.path, size: entry.size })),
			}),
		};
		const controller = new api.ImportController({ FS: fs }, {
			storage: storage,
			onReimportReady: () => replacements++,
		});
		controller.storage = storage;
		controller.launched = true;
		await controller.importEntries(syntheticEntries());
		assert(replacements === 1);
		assert(fs.files.size === 0, "live Emscripten FS was overwritten during re-import");
	});

	await run("clear removes the saved dataset", async () => {
		await idbStorage.clear();
		assert(await idbStorage.load() === null);
	});

	await run("OPFS backend round-trips fake files when available", async () => {
		if (!navigator.storage || typeof navigator.storage.getDirectory !== "function") return;
		const root = await navigator.storage.getDirectory();
		const directoryName = "surrealengine-importer-test-" + Date.now() + "-" + Math.random().toString(36).slice(2);
		const storage = new api.OPFSStorage(root, directoryName);
		try {
			const metadata = await storage.save(validation);
			assert(metadata.backend === "opfs");
			const replacement = await storage.save(validation);
			assert(replacement.datasetId !== metadata.datasetId, "replacement reused the active generation");
			const loaded = await storage.load();
			assert(loaded.metadata.datasetId === replacement.datasetId, "replacement generation was not published");
			assert(loaded.mount.type === "wasmfs-opfs-v1" && loaded.mount.storageDirectory === directoryName);
			assert(loaded.mount.datasetId === replacement.datasetId);
			assert(await (await loaded.getBlob("Maps/DM-Synthetic.unr")).text() === "fake-map");
			const appRoot = await root.getDirectoryHandle(directoryName);
			const imports = await appRoot.getDirectoryHandle("imports");
			let oldGenerationPresent = true;
			try { await imports.getDirectoryHandle(metadata.datasetId); }
			catch (error) { if (error && error.name === "NotFoundError") oldGenerationPresent = false; else throw error; }
			assert(!oldGenerationPresent, "replacement left the previous OPFS generation behind");
			await imports.removeEntry(replacement.datasetId, { recursive: true });
			await expectError("STORAGE_MISSING_DATASET", async () => storage.load());
		} finally {
			await storage.clear();
		}
	});

	window.importerTestDone = true;
	const failures = window.importerTestResults.filter(result => !result.passed);
	document.getElementById("results").textContent = JSON.stringify(window.importerTestResults, null, 2);
	if (failures.length) throw new Error(failures.length + " importer test(s) failed");
	return window.importerTestResults;
})();
</script>
