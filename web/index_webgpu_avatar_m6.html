<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SurrealEngine browser harness (WebGPU, avatar M6)</title>
</head>
<body>
<canvas id="canvas" width="640" height="480"></canvas>
<pre id="log" style="white-space:pre-wrap;font:12px monospace;"></pre>
<script src="ut99_importer.js"></script>
<script src="pointer_lock_gesture.js"></script>
<script src="mutable_persistence.js"></script>
<script src="browser_data_bootstrap.js"></script>
<script>
	// M6 verification harness only (Docs/FULLBODY_VR_AVATAR_PLAN.md) - same
	// shape as index_webgpu.html, pointed at a build with the avatar feature
	// and launched with --avatar-autorig-debug/--avatar-ik-synthetic so the
	// full auto-rig/IK/skin pipeline runs without a headset. Not part of the
	// regular M1/M2 harness pair.
	window.surrealLog = [];
	window.surrealBooted = false;
	window.surrealCrashed = null;

	const logEl = document.getElementById('log');
	function appendLog(line) {
		window.surrealLog.push(line);
		logEl.textContent += line + "\n";
	}

	var Module = {
		canvas: document.getElementById("canvas"),
		locateFile: function (path) { return "../build-emscripten-m6/" + path; },
		print: appendLog,
		printErr: appendLog,
		onRuntimeInitialized: function () {
			appendLog("[harness] runtime initialized, preparing local game data");
			window.surrealDataBootPromise = window.SurrealBrowserData.start(Module, {
				log: appendLog,
				logSnapshot: () => window.surrealLog.join("\n") + "\n",
				launch: selection => {
					Module.callMain(["--autoplay", "--url=" + selection.map, "--render=webgpu",
						"--avatar-autorig-debug", "--avatar-ik-synthetic", "/gamedata"]);
					window.surrealBooted = true;
				},
			}).then(started => {
				window.surrealBrowserDataController = started.controller;
				window.surrealDataBootResult = started.result;
				return started.result;
			}).catch(e => {
				window.surrealCrashed = String(e);
				appendLog("[harness] data bootstrap failed: " + e);
				if (e && e.stack) appendLog("[harness] stack: " + e.stack);
			});
		},
	};

	window.addEventListener("error", function (e) {
		var detail = (e.error && e.error.stack) ? e.error.stack : e.message;
		window.surrealCrashed = detail;
		appendLog("[harness] window error: " + detail);
	});
	window.addEventListener("unhandledrejection", function (e) {
		window.surrealCrashed = String(e.reason);
		appendLog("[harness] unhandled rejection: " + e.reason);
	});

	window.surrealGetTickCount = function () {
		return Module.ccall("Surreal_GetTickCount", "number", [], []);
	};
	window.surrealRequestQuit = function () {
		return Module.ccall("Surreal_RequestQuit", null, [], []);
	};
	window.surrealGetWebGPUErrorCount = function () {
		return Module.ccall("Surreal_GetWebGPUErrorCount", "number", [], []);
	};
	window.surrealGetWebGPUDrawCalls = function () {
		return Module.ccall("Surreal_GetWebGPUDrawCalls", "number", [], []);
	};
	window.surrealGetWebGPUGouraudPolygons = function () {
		return Module.ccall("Surreal_GetWebGPUGouraudPolygons", "number", [], []);
	};

	async function boot() {
		if (!navigator.gpu) {
			window.surrealCrashed = "navigator.gpu is undefined (no WebGPU support in this browser)";
			appendLog("[harness] " + window.surrealCrashed);
			return;
		}
		const adapter = await navigator.gpu.requestAdapter();
		if (!adapter) {
			window.surrealCrashed = "navigator.gpu.requestAdapter() resolved null";
			appendLog("[harness] " + window.surrealCrashed);
			return;
		}
		const requiredFeatures = ["texture-compression-bc", "float32-filterable"].filter(f => adapter.features.has(f));
		const device = await adapter.requestDevice({ requiredFeatures });
		device.lost.then(info => appendLog("[harness] WebGPU device lost: " + info.message));
		window.surrealWebGPUErrorCount = 0;
		device.addEventListener("uncapturederror", function (event) {
			window.surrealWebGPUErrorCount++;
			appendLog("[harness] WebGPU uncaptured error: " + event.error.message);
		});
		Module.preinitializedWebGPUDevice = device;
		appendLog("[harness] WebGPU device acquired, loading wasm module");
		const script = document.createElement("script");
		script.src = "../build-emscripten-m6/SurrealEngine.js";
		script.onerror = function () {
			window.surrealCrashed = "failed to load SurrealEngine.js";
			appendLog("[harness] " + window.surrealCrashed);
		};
		document.body.appendChild(script);
	}
	boot();
</script>
</body>
</html>
