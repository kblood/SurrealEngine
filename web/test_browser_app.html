<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SurrealEngine browser launcher tests</title></head>
<body>
<section id="startup-test-surface" hidden><canvas width="64" height="36"></canvas><span>Starting</span></section>
<section id="launcher" hidden>
	<span data-launcher-game></span>
	<form data-launcher-form>
		<select data-launcher-map></select>
		<select data-launcher-presentation></select>
		<select data-launcher-webxr-backend disabled><option value="auto">Automatic</option><option value="webgl-bridge">Force WebGL compatibility bridge</option></select>
		<input type="checkbox" data-launcher-webxr-bridge-blocking-timing disabled>
		<input type="checkbox" data-launcher-webxr-bridge-rotation-reprojection disabled>
		<select data-launcher-renderer><option value="webgpu">WebGPU</option><option value="null">Null</option></select>
		<select data-launcher-xr-dominant-hand><option value="right">Right</option><option value="left">Left</option></select>
		<input type="checkbox" data-launcher-skip-intro checked>
		<button type="submit">Play</button><p data-launcher-error hidden></p>
	</form>
</section>
<details id="diagnostics"><summary>Diagnostics</summary>
	<span data-xr-diagnostics-capability></span><span data-xr-diagnostics-adapter></span>
	<span data-xr-diagnostics-phase></span><span data-xr-diagnostics-error></span>
	<span data-xr-diagnostics-frames></span><span data-xr-diagnostics-input></span>
	<span data-xr-diagnostics-projection></span><span data-xr-diagnostics-reference></span>
	<span data-xr-diagnostics-mode></span><span data-xr-diagnostics-dimensions></span>
	<span data-xr-diagnostics-preference></span>
	<span data-xr-diagnostics-bridge></span>
	<span data-xr-diagnostics-lifecycle></span>
	<button data-xr-diagnostics-copy></button><button data-xr-diagnostics-download></button>
</details>
<pre id="results">running</pre>
<script src="ut99_importer.js"></script><script src="browser_app.js"></script>
<script src="webxr_browser_app_adapter.js"></script><script src="webxr_diagnostics.js"></script><script src="browser_release.js"></script>
<script>
"use strict";
window.browserAppTestResults = []; window.browserAppTestDone = false;
function assert(value, message) { if (!value) throw new Error(message || "assertion failed"); }
async function expectError(code, callback) { try { await callback(); } catch (error) { assert(error.code === code, "expected " + code + ", got " + error.code); return; } throw new Error("expected " + code); }
async function run(name, callback) { try { await callback(); browserAppTestResults.push({ name, passed: true, detail: "" }); } catch (error) { browserAppTestResults.push({ name, passed: false, detail: error.stack || String(error) }); } }
window.browserAppTestPromise = (async () => {
	const api = SurrealBrowserApp;
	await run("presentation providers are isolated and checked", async () => {
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop" });
		registry.register({ id: "optional", label: "Optional", isAvailable: false });
		assert(registry.available().map(item => item.id).join(",") === "flat");
		await expectError("PRESENTATION_DUPLICATE", () => registry.register({ id: "flat", label: "Again" }));
	});
	await run("native arguments are fixed and reject unsafe input", async () => {
		const args = api.buildNativeArguments({ game: { id: "unreal-gold" }, map: "Vortex2", renderer: "webgpu" });
		assert(args.join(" ") === "--autoplay --url=Vortex2 --render=webgpu /gamedata");
		const webglArgs = api.buildNativeArguments({ game: { id: "unreal-gold" }, map: "Vortex2", renderer: "webgl2" });
		assert(webglArgs.join(" ") === "--autoplay --url=Vortex2 --render=webgl2 /gamedata");
		assert(Object.isFrozen(args));
		let received = null;
		api.callNativeMain({ callMain(value) { received = value; value.unshift("SurrealEngine"); } },
			{ game: { id: "unreal-gold" }, map: "Vortex2", renderer: "webgpu" });
		assert(received[0] === "SurrealEngine" && !Object.isFrozen(received), "callMain received frozen argv");
		assert(args[0] === "--autoplay", "callMain mutated the immutable launch description");
		let asyncCall = null;
		await api.callNativeMain({
			_Surreal_StartBrowserGame() {},
			ccall(name, returnType, argumentTypes, values, options) {
				asyncCall = { name, returnType, argumentTypes, values, options };
				return Promise.resolve(0);
			},
			callMain() { throw new Error("Asyncify launcher used callMain"); },
		}, { game: { id: "unreal-gold" }, map: "Vortex2", renderer: "webgpu" });
		assert(asyncCall.name === "Surreal_StartBrowserGame" && asyncCall.options.async === true);
		assert(asyncCall.values.join("|") === "Vortex2|webgpu|1");
		const introArgs = api.buildNativeArguments({ game: { id: "unreal-gold" }, skipIntro: false, renderer: "webgpu" });
		assert(introArgs.join(" ") === "--autoplay --render=webgpu /gamedata");
		await expectError("LAUNCH_MAP", () => api.buildNativeArguments({ game: { id: "unreal-gold" }, map: "../Entry", renderer: "webgpu" }));
		await expectError("LAUNCH_RENDERER", () => api.buildNativeArguments({ game: { id: "ut99" }, map: "DM-Test", renderer: "native" }));
	});
	await run("WebAssembly aborts become an observable runtime failure", async () => {
		const events = [];
		const environment = new EventTarget();
		environment.CustomEvent = CustomEvent;
		environment.addEventListener("surrealruntimeabort", event => events.push(event.detail.message));
		const logs = [];
		const handler = api.createRuntimeAbortHandler(value => logs.push(value), value => events.push(value), environment);
		const detail = handler(new Error("test heap exhausted"));
		assert(environment.surrealCrashed === detail && detail.includes("test heap exhausted"));
		assert(logs.length === 1 && logs[0] === "[runtime] " + detail);
		assert(events.length === 2 && events[0] === detail && events[1] === detail);
		const uncaught = api.createUnhandledRuntimeErrorHandler(value => logs.push(value), null, environment);
		const uncaughtDetail = uncaught({ error: new Error("test RAF failure") });
		assert(environment.surrealCrashed === uncaughtDetail && uncaughtDetail.includes("test RAF failure"));
		assert(uncaughtDetail.startsWith("Uncaught browser runtime error:"));
	});
	await run("flat viewport resize keeps CSS pixels, device scale, and native geometry synchronized", async () => {
		const environment = new EventTarget();
		environment.document = new EventTarget();
		environment.devicePixelRatio = 2;
		let bounds = { width: 640, height: 360 };
		const canvas = { getBoundingClientRect: () => bounds };
		const calls = [];
		const controller = new api.BrowserViewportController(canvas, { environment });
		controller.attachModule({ ccall(name, returnType, argumentTypes, values) {
			calls.push({ name, returnType, argumentTypes, values });
			return 1;
		} });
		controller.engineStarted();
		assert(calls.length === 1 && calls[0].name === "Surreal_ResizeBrowserViewport");
		assert(calls[0].values.join("x") === "1280x720");
		environment.dispatchEvent(new Event("resize"));
		assert(calls.length === 1, "unchanged CSS geometry caused a redundant native resize");
		bounds = { width: 500, height: 300 };
		environment.document.dispatchEvent(new Event("fullscreenchange"));
		assert(calls.length === 2 && calls[1].values.join("x") === "1000x600");
		const status = controller.diagnostics();
		assert(status.running && status.width === 1000 && status.height === 600 &&
			status.resizeCount === 2 && status.lastError === null);
	});
	await run("desktop host records become importer entries without exposing native paths", async () => {
		const picker = api.createHostPicker({ pickGameDirectory: async () => [{ path: "System/Core.u", blob: new Blob(["core"]) }] });
		const entries = await picker();
		assert(entries.length === 1 && entries[0].path === "System/Core.u" && entries[0].size === 4);
		assert(await (await entries[0].getBlob()).text() === "core");
		let reads = 0;
		const lazy = api.createHostPicker({
			pickGameDirectory: async () => [{ path: "System/Engine.u", size: 6, token: "opaque-1" }],
			readGameFile: async token => { assert(token === "opaque-1"); reads++; return new TextEncoder().encode("engine"); },
		});
		const lazyEntries = await lazy();
		assert(reads === 0, "desktop data was read eagerly");
		assert(await (await lazyEntries[0].getBlob()).text() === "engine" && reads === 1);
	});
	await run("game library routes each title to an isolated persistent store", async () => {
		const state = new Map();
		const storage = { getItem: key => state.get(key) || null, setItem: (key, value) => state.set(key, value) };
		const saves = [];
		const library = new api.GameLibrary(storage, options => Promise.resolve({
			load: async () => null,
			save: async validation => { saves.push({ options, gameId: validation.gameId }); return { gameId: validation.gameId }; },
			clear: async () => {},
		}));
		library.requestImport();
		assert(library.status().importing);
		await library.storageProxy().save({ gameId: "unreal-gold" });
		assert(library.status().activeGameId === "unreal-gold" && !library.status().importing);
		assert(library.status().installed.join(",") === "unreal-gold");
		assert(saves[0].options.databaseName === "surrealengine-game-unreal-gold-v1");
		assert(library.mutableOptions("unreal-gold").databaseName === "surrealengine-mutable-unreal-gold-v1");
	});
	await run("launcher waits for explicit play and invokes the selected provider", async () => {
		localStorage.clear();
		let prepared = 0;
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop", prepareLaunch: async value => { assert(value.selection.map === "DM-Two"); prepared++; } });
		const controller = new api.LauncherController(document.getElementById("launcher"), registry);
		const pending = controller.selectLaunch({
			game: SurrealGameImporter.GAME_DEFINITIONS.ut99,
			mapManifest: { state: "ready", maps: ["DM-One", "DM-Two"] },
		});
		document.querySelector("[data-launcher-map]").value = "DM-Two";
		document.querySelector("[data-launcher-xr-dominant-hand]").value = "left";
		document.querySelector("[data-launcher-form]").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
		const selection = await pending;
		assert(selection.map === "DM-Two" && selection.presentationId === "flat" && prepared === 1);
		assert(selection.skipIntro === true && selection.xrDominantHand === "left");
		assert(!("webXRPresentationPreference" in selection), "flat selection gained WebXR-only state");
		assert(document.querySelector("[data-launcher-webxr-backend]").disabled);
		assert(document.getElementById("launcher").hidden);
	});
	await run("launcher persists an immutable WebXR backend choice only for immersive launches", async () => {
		localStorage.clear();
		let prepared = null;
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop" });
		registry.register({ id: "webxr", label: "Immersive WebXR", prepareLaunch: async value => { prepared = value.selection; } });
		const root = document.getElementById("launcher");
		const controller = new api.LauncherController(root, registry);
		const context = { game: SurrealGameImporter.GAME_DEFINITIONS.ut99,
			mapManifest: { state: "ready", maps: ["DM-Deck16"] } };
		const pending = controller.selectLaunch(context);
		const presentation = root.querySelector("[data-launcher-presentation]");
		const backend = root.querySelector("[data-launcher-webxr-backend]");
		const blockingTiming = root.querySelector("[data-launcher-webxr-bridge-blocking-timing]");
		const rotationReprojection = root.querySelector("[data-launcher-webxr-bridge-rotation-reprojection]");
		presentation.value = "webxr";
		presentation.dispatchEvent(new Event("change", { bubbles: true }));
		assert(!backend.disabled && blockingTiming.disabled && !blockingTiming.checked &&
			rotationReprojection.disabled && !rotationReprojection.checked);
		backend.value = "webgl-bridge";
		backend.dispatchEvent(new Event("change", { bubbles: true }));
		assert(!blockingTiming.disabled);
		blockingTiming.checked = true;
		rotationReprojection.checked = true;
		root.querySelector("[data-launcher-form]").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
		const selection = await pending;
		assert(Object.isFrozen(selection) && selection.webXRPresentationPreference === "webgl-bridge");
		assert(selection.webXRBridgeBlockingTiming === true);
		assert(selection.webXRBridgeRotationReprojection === true);
		assert(prepared === selection);
		const next = controller.selectLaunch(context);
		assert(presentation.value === "webxr" && backend.value === "webgl-bridge" && !backend.disabled);
		assert(!blockingTiming.checked && !blockingTiming.disabled, "blocking timing persisted enabled across launches");
		assert(!rotationReprojection.checked && !rotationReprojection.disabled,
			"rotation reprojection persisted enabled across launches");
		blockingTiming.checked = true;
		backend.value = "auto";
		backend.dispatchEvent(new Event("change", { bubbles: true }));
		assert(blockingTiming.disabled && !blockingTiming.checked, "automatic mode retained forced-bridge QA timing");
		presentation.value = "flat";
		presentation.dispatchEvent(new Event("change", { bubbles: true }));
		assert(backend.disabled && blockingTiming.disabled && !blockingTiming.checked);
		root.querySelector("[data-launcher-form]").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
		const flat = await next;
		assert(!("webXRPresentationPreference" in flat));
	});
	await run("launcher selects the game default map before the alphabetical manifest entry", async () => {
		localStorage.clear();
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop" });
		const root = document.getElementById("launcher");
		const controller = new api.LauncherController(root, registry);
		const pending = controller.selectLaunch({
			game: SurrealGameImporter.GAME_DEFINITIONS["unreal-gold"],
			mapManifest: { state: "ready", maps: ["Bluff", "Vortex2"] },
		});
		assert(root.querySelector("[data-launcher-map]").value === "Vortex2");
		root.querySelector("[data-launcher-map]").value = "Bluff";
		root.querySelector("[data-launcher-form]").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
		await pending;
		const next = controller.selectLaunch({
			game: SurrealGameImporter.GAME_DEFINITIONS["unreal-gold"],
			mapManifest: { state: "ready", maps: ["Bluff", "Vortex2"] },
		});
		assert(root.querySelector("[data-launcher-map]").value === "Bluff");
		root.querySelector("[data-launcher-form]").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
		await next;
	});
	await run("launcher can intentionally use the configured LocalMap intro", async () => {
		localStorage.clear();
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop" });
		const root = document.getElementById("launcher");
		const controller = new api.LauncherController(root, registry);
		const pending = controller.selectLaunch({
			game: SurrealGameImporter.GAME_DEFINITIONS["unreal-gold"],
			mapManifest: { state: "ready", maps: ["Unreal", "Vortex2"] },
		});
		const skip = root.querySelector("[data-launcher-skip-intro]");
		skip.checked = false;
		skip.dispatchEvent(new Event("change", { bubbles: true }));
		assert(root.querySelector("[data-launcher-map]").disabled, "normal intro left direct-map selection active");
		root.querySelector("[data-launcher-form]").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
		const selection = await pending;
		assert(selection.skipIntro === false);
		assert(api.buildNativeArguments(selection).join(" ") === "--autoplay --render=webgpu /gamedata");
	});
	await run("presentation activation runs after native startup", async () => {
		const events = [];
		const registry = new api.PresentationRegistry();
		registry.register({ id: "webxr", label: "WebXR", activate: async value => {
			assert(value.Module.marker === "runtime");
			events.push("activate");
		} });
		const selection = { presentationId: "webxr" };
		events.push("callMain");
		await api.activatePresentation(registry, selection, { marker: "runtime" });
		assert(events.join(",") === "callMain,activate");
	});
	await run("launch boundary paints loading state before synchronous native startup", async () => {
		const events = [];
		const surface = document.getElementById("startup-test-surface");
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop", activate: async () => events.push("activate") });
		const Module = { callMain(args) {
			assert(!surface.hidden && surface.getClientRects().length === 1, "loading surface was not visible at callMain");
			events.push("callMain:" + args[1]);
		} };
		const status = await api.runLaunchBoundary({
			Module, registry,
			selection: { game: { id: "ut99" }, map: "DM-Test", renderer: "webgpu", presentationId: "flat" },
			onStartupStage: snapshot => {
				events.push("stage:" + snapshot.stage);
				if (snapshot.stage === "native-startup") surface.hidden = false;
			},
			waitForPaint: async () => {
				await api.waitForBrowserPaint(window);
				events.push("paint");
			},
			onLaunch: () => events.push("onLaunch"),
		});
		assert(events.join(",") === "stage:native-startup,paint,callMain:--url=DM-Test,stage:native-ready,stage:presentation-activation,activate,stage:running,onLaunch");
		assert(status.stage === "running" && status.nativeStartupMs !== null);
		assert(Object.keys(status).sort().join(",") === "elapsedMs,nativeStartupMs,stage,stageElapsedMs",
			"startup status exposed fields outside the privacy allowlist");
		surface.hidden = true;
	});
	await run("native startup is not reported ready before callMain returns", async () => {
		let clock = 10;
		const stages = [];
		const tracker = new api.LaunchStartupTracker({ clock: () => clock, onChange: value => stages.push(value.stage) });
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop" });
		await api.runLaunchBoundary({
			Module: { callMain() { assert(stages.join(",") === "native-startup"); clock = 75; } },
			selection: { game: { id: "ut99" }, map: "DM-Test", renderer: "webgpu", presentationId: "flat" },
			registry, startupTracker: tracker, waitForPaint: async () => { clock = 25; },
		});
		assert(stages.join(",") === "native-startup,native-ready,presentation-activation,running");
		assert(tracker.status().nativeStartupMs === 50);
	});
	await run("browser launch applies the persistent XR dominant-hand adapter", async () => {
		let applied = null;
		const registry = new api.PresentationRegistry();
		registry.register({ id: "flat", label: "Desktop" });
		await api.runLaunchBoundary({
			Module: {
				callMain() {},
				ccall(name, returnType, argumentTypes, values, options) {
					assert(name === "Surreal_SetXRDominantHand" && returnType === "number");
					assert(options && options.async === true,
						"persistent browser hand adapter was not Asyncify-safe");
					applied = values[0];
					return 1;
				},
			},
			selection: { game: { id: "ut99" }, map: "DM-Test", renderer: "webgpu",
				presentationId: "flat", xrDominantHand: "left" },
			registry, waitForPaint: async () => {},
		});
		assert(applied === 0, "left dominant-hand selection did not reach the native adapter");
	});
	await run("WebGPU acquisition requests XR compatibility and falls back flat with diagnostics", async () => {
		const originalGPU = navigator.gpu;
		const requests = [];
		const diagnostics = [];
		const device = { lost: new Promise(() => {}) };
		const adapter = { features: new Set(), async requestDevice() { return device; } };
		Object.defineProperty(navigator, "gpu", { configurable: true, value: {
			async requestAdapter(options) { requests.push(options || null); return requests.length === 1 ? null : adapter; },
		} });
		try {
			const acquired = await api.acquireWebGPUDevice(() => {}, {
				xrCompatible: true,
				onXRCompatibility: (available, detail) => diagnostics.push({ available, detail }),
			});
			assert(acquired === device);
			assert(requests.length === 2 && requests[0].xrCompatible === true && requests[1] === null);
			assert(diagnostics.length === 1 && !diagnostics[0].available && diagnostics[0].detail.includes("XR-compatible"));
			assert(window.surrealWebGPUDeviceXRCompatible === false);
			Object.defineProperty(navigator, "gpu", { configurable: true, value: {
				async requestAdapter(options) { requests.push(options || null); return adapter; },
			} });
			await api.acquireWebGPUDevice(() => {}, { xrCompatible: true });
			assert(window.surrealWebGPUDeviceXRCompatible === true);
		} finally {
			Object.defineProperty(navigator, "gpu", { configurable: true, value: originalGPU });
		}
	});
	await run("flat WebGPU acquisition never requests XR compatibility", async () => {
		const originalGPU = navigator.gpu;
		const requests = [];
		const device = { lost: new Promise(() => {}) };
		const adapter = { features: new Set(), async requestDevice() { return device; } };
		Object.defineProperty(navigator, "gpu", { configurable: true, value: {
			async requestAdapter(options) { requests.push(options); return adapter; },
		} });
		try {
			assert(await api.acquireWebGPUDevice(() => {}, { xrCompatible: false }) === device);
			assert(requests.length === 1 && requests[0] === undefined,
				"flat mode requested an XR-compatible adapter");
			assert(window.surrealWebGPUDeviceXRCompatible === false);
		} finally {
			Object.defineProperty(navigator, "gpu", { configurable: true, value: originalGPU });
		}
	});
	await run("release capability checks keep flat mode independent from WebXR", async () => {
		const platform = await SurrealBrowserRelease.detectPlatformCapabilities({
			isSecureContext: true,
			AudioContext: function () {},
			WebAssembly: {}, File, Blob, indexedDB: {}, showDirectoryPicker() {},
			navigator: { gpu: {}, storage: { getDirectory() {}, async persisted() { return true; } } },
		});
		assert(SurrealBrowserRelease.canStart(platform));
		const noGPU = await SurrealBrowserRelease.detectPlatformCapabilities({
			isSecureContext: true, AudioContext: function () {}, WebAssembly: {}, File, Blob, indexedDB: {},
			navigator: { storage: { async persisted() { return false; } } },
		});
		assert(SurrealBrowserRelease.canStart(noGPU) && !noGPU.webGPU.available,
			"missing navigator.gpu blocked the data/import shell");
	});
	await run("packaged release diagnostics reject mixed engine identities", async () => {
		const javascript = "engine/SurrealEngine." + "a".repeat(64) + ".js";
		const wasm = "engine/SurrealEngine." + "b".repeat(64) + ".wasm";
		const manifest = { schema: "surrealengine-browser-release-v2", version: 2, buildId: "build-test",
			entrypoints: { html: "index.html", javascript, wasm }, build: { profile: "diagnostic" },
			sourceCompliance: {}, files: [
				{ path: javascript, bytes: 1, sha256: "a".repeat(64), expectedMime: "text/javascript", cacheControl: "immutable" },
				{ path: wasm, bytes: 1, sha256: "b".repeat(64), expectedMime: "application/wasm", cacheControl: "immutable" },
			] };
		const environment = {
			document: { documentElement: { dataset: { engineScript: "./" + javascript, engineWasm: "./" + wasm } } },
			performance: { now: () => 10, getEntriesByType: () => [] },
			navigator: { userAgent: "synthetic", hardwareConcurrency: 4 }, location: { origin: "https://example.test" },
			isSecureContext: true, crossOriginIsolated: true, SharedArrayBuffer: window.SharedArrayBuffer,
			async fetch() { return { ok: true, status: 200, redirected: false,
				headers: { get: () => null }, async json() { return manifest; } }; },
		};
		const diagnostics = new SurrealBrowserRelease.ReleaseDiagnostics(environment);
		await diagnostics.loadIdentity();
		assert(diagnostics.report().build.id === "build-test");
		environment.document.documentElement.dataset.engineWasm = "./" + javascript;
		const mixed = new SurrealBrowserRelease.ReleaseDiagnostics(environment);
		let rejected = false;
		try { await mixed.loadIdentity(); }
		catch (error) { rejected = String(error).includes("different engine assets"); }
		assert(rejected, "mixed engine identity was accepted");
	});
	await run("WebXR probe and failed entry report a flat fallback", async () => {
		const environment = {
			isSecureContext: true,
			navigator: { xr: { async isSessionSupported(mode) { return mode === "immersive-vr"; } } },
			XRGPUBinding() {},
			async surrealXREnter() { return false; },
			surrealXRGetState() { return { lastError: "headset declined" }; },
		};
		const capability = await SurrealWebXRBrowserProvider.probe(environment);
		assert(capability.available && capability.code === "ready");
		const activation = await SurrealWebXRBrowserProvider.createProvider(capability, environment)
			.activate({ Module: { preinitializedWebGPUDevice: {} } });
		assert(!activation.active && activation.fallback === "flat" && activation.message === "headset declined");
	});
	await run("headset diagnostics are allowlisted, copyable, and data-free", async () => {
		let copied = null;
		let downloaded = null;
		window.surrealXRGetState = () => ({
			phase: "running", currentStage: "running", lastError: "C:\\Private\\Game\\System\\Core.u",
			lastErrorCode: "feature-negotiation-unobservable", lastErrorStage: "request-reference-space",
			frames: 23, skippedFrames: 2, inputPackets: 9,
			projectionFormat: "rgba8unorm-webgl-bridge", referenceSpaceType: "local-floor",
			presentationMode: "webgl-bridge", presentationPreference: "webgl-bridge", layerWidth: 1832, layerHeight: 1920,
			atlasWidth: 1600, atlasHeight: 700,
			bridgeDiagnostics: { frames: 23, errors: 0, samples: 120, medianMs: 0.51234,
				p95Ms: 3.98765, p99Ms: 5.43219, blockingTiming: true,
				privatePath: "C:\\Private\\Game", url: "https://private.invalid/game" },
			enterAttempts: 2,
			successfulEntries: 2, exitRequests: 1, endedSessions: 1, reentries: 1,
			transitions: [{ type: "session-entered", generation: 1, stage: "running" },
				{ type: "session-reentered", generation: 2, stage: "running" }],
			url: "https://private.invalid/game", userAgent: "Private Browser 1", gameIdentity: "Owned UT99",
			logs: ["private engine log"],
		});
		const panel = SurrealWebXRDiagnostics.create(document.getElementById("diagnostics"), {
			copyText: value => { copied = value; }, downloadText: value => { downloaded = value; },
		});
		window.dispatchEvent(new CustomEvent("surrealwebxrcapability", { detail: { available: true, code: "ready" } }));
		window.dispatchEvent(new CustomEvent("surrealwebxradapter", { detail: { available: true, state: "xr-compatible" } }));
		const report = panel.report();
		assert(report.includes("schema: surrealengine-webxr-headset-report-v2"));
		assert(report.includes("capability_code: ready") && report.includes("frames: 23"));
		assert(report.includes("reentries: 1") && report.includes("provider_error: present"));
		assert(report.includes("provider_error_code: feature-negotiation-unobservable"));
		assert(report.includes("presentation_mode: webgl-bridge"));
		assert(report.includes("presentation_preference: webgl-bridge"));
		assert(report.includes("layer_width: 1832") && report.includes("atlas_width: 1600"));
		assert(report.includes("bridge_samples: 120") && report.includes("bridge_median_ms: 0.512"));
		assert(report.includes("bridge_p95_ms: 3.988") && report.includes("bridge_p99_ms: 5.432"));
		assert(report.includes("bridge_errors: 0") && report.includes("bridge_blocking_timing: yes"));
		assert(document.querySelector("[data-xr-diagnostics-mode]").textContent === "webgl-bridge");
		assert(document.querySelector("[data-xr-diagnostics-preference]").textContent === "webgl-bridge");
		assert(!report.includes("Private") && !report.includes("Core.u") && !report.includes("C:\\"));
		assert(!report.includes("private.invalid") && !report.includes("Owned UT99") &&
			!report.includes("engine log") && !report.includes("Browser 1"));
		const direct = SurrealWebXRDiagnostics.formatReport({ presentationMode: "direct-webgpu",
			layerWidth: 2048, layerHeight: 1024, privatePath: "D:\\Games\\Unreal" });
		assert(direct.includes("presentation_mode: direct-webgpu") && direct.includes("layer_width: 2048"));
		assert(direct.includes("bridge_p99_ms: unknown") && !direct.includes("Games") && !direct.includes("Unreal"));
		await panel.copy();
		panel.download();
		assert(copied === report && downloaded === report);
	});
	window.browserAppTestDone = true;
	document.getElementById("results").textContent = JSON.stringify(browserAppTestResults, null, 2);
	const failures = browserAppTestResults.filter(result => !result.passed);
	if (failures.length) throw new Error(failures.length + " browser launcher test(s) failed");
	return browserAppTestResults;
})();
