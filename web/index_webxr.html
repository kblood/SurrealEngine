<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SurrealEngine WebXR M4-groundwork harness</title>
</head>
<body>
<!-- M4 groundwork harness (NOT real M4 rendering — see webxr_session.js's
     header comment and WEBXR_IMPLEMENTATION_PLAN.md's M4 milestone). Boots
     the engine exactly like index_webgpu.html (real WebGPU device handed in
     before callMain, same as M2), and separately proves a WebXR session can
     be requested/driven from the same page via webxr_session.js. The two
     are NOT wired together yet: the XR session's frame loop does not drive
     SurrealEngine's renderer. This only proves the plumbing IWER-based
     headless testing needs to exist for real M4 work to build on. -->
<canvas id="canvas" width="640" height="480"></canvas>
<button id="entervr" disabled>Enter VR</button>
<pre id="log" style="white-space:pre-wrap;font:12px monospace;"></pre>
<script src="webxr_session.js"></script>
<script>
	window.surrealLog = [];
	window.surrealBooted = false;
	window.surrealCrashed = null;

	const logEl = document.getElementById('log');
	function appendLog(line) {
		window.surrealLog.push(line);
		logEl.textContent += line + "\n";
	}

	var Module = {
		canvas: document.getElementById("canvas"),
		locateFile: function (path) { return "../build-emscripten/" + path; },
		print: appendLog,
		printErr: appendLog,
		onRuntimeInitialized: function () {
			appendLog("[harness] runtime initialized, calling main");
			window.surrealBooted = true;
			try {
				Module.callMain(["--autoplay", "--url=DM-Deck16][", "--render=webgpu", "/gamedata"]);
			} catch (e) {
				window.surrealCrashed = String(e);
				appendLog("[harness] callMain threw: " + e);
				if (e && e.stack) appendLog("[harness] stack: " + e.stack);
			}
		},
	};

	window.addEventListener("error", function (e) {
		var detail = (e.error && e.error.stack) ? e.error.stack : e.message;
		window.surrealCrashed = detail;
		appendLog("[harness] window error: " + detail);
	});
	window.addEventListener("unhandledrejection", function (e) {
		window.surrealCrashed = String(e.reason);
		appendLog("[harness] unhandled rejection: " + e.reason);
	});

	window.surrealGetTickCount = function () {
		return Module.ccall("Surreal_GetTickCount", "number", [], []);
	};
	window.surrealRequestQuit = function () {
		return Module.ccall("Surreal_RequestQuit", null, [], []);
	};
	window.surrealGetWebGPUErrorCount = function () {
		return Module.ccall("Surreal_GetWebGPUErrorCount", "number", [], []);
	};
	window.surrealGetWebGPUDrawCalls = function () {
		return Module.ccall("Surreal_GetWebGPUDrawCalls", "number", [], []);
	};
	window.surrealGetWebGPUTextureCount = function () {
		return Module.ccall("Surreal_GetWebGPUTextureCount", "number", [], []);
	};

	document.getElementById("entervr").addEventListener("click", function () {
		if (window.surrealXRSessionActive) {
			window.surrealXRExit();
		} else {
			window.surrealXREnter();
		}
	});

	async function boot() {
		// WebXR capability checks run independent of / before the WebGPU
		// device request below - proves the session-lifecycle plumbing works
		// even if the engine itself fails to boot.
		await window.surrealXRCheckSupport();
		await window.surrealXRCheckGPUCompatible();
		document.getElementById("entervr").disabled = !window.surrealXRSupported;

		if (!navigator.gpu) {
			window.surrealCrashed = "navigator.gpu is undefined (no WebGPU support in this browser)";
			appendLog("[harness] " + window.surrealCrashed);
			return;
		}
		const adapter = await navigator.gpu.requestAdapter();
		if (!adapter) {
			window.surrealCrashed = "navigator.gpu.requestAdapter() resolved null";
			appendLog("[harness] " + window.surrealCrashed);
			return;
		}
		const requiredFeatures = ["texture-compression-bc", "float32-filterable"].filter(f => adapter.features.has(f));
		const device = await adapter.requestDevice({ requiredFeatures });
		device.lost.then(info => appendLog("[harness] WebGPU device lost: " + info.message));
		window.surrealWebGPUErrorCount = 0;
		device.addEventListener("uncapturederror", function (event) {
			window.surrealWebGPUErrorCount++;
			appendLog("[harness] WebGPU uncaptured error: " + event.error.message);
		});
		Module.preinitializedWebGPUDevice = device;
		appendLog("[harness] WebGPU device acquired, loading wasm module");
		const script = document.createElement("script");
		script.src = "../build-emscripten/SurrealEngine.js";
		script.onerror = function () {
			window.surrealCrashed = "failed to load SurrealEngine.js";
			appendLog("[harness] " + window.surrealCrashed);
		};
		document.body.appendChild(script);
	}
	boot();
</script>
</body>
</html>
