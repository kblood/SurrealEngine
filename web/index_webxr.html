<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SurrealEngine WebXR M4-groundwork harness</title>
</head>
<body>
<!-- M4 groundwork harness (NOT real M4 rendering — see webxr_session.js's
     header comment and WEBXR_IMPLEMENTATION_PLAN.md's M4 milestone). Boots
     the engine exactly like index_webgpu.html (real WebGPU device handed in
     before callMain, same as M2), and separately proves a WebXR session can
     be requested/driven from the same page via webxr_session.js. The two
     are NOT wired together yet: the XR session's frame loop does not drive
     SurrealEngine's renderer. This only proves the plumbing IWER-based
     headless testing needs to exist for real M4 work to build on. -->
<canvas id="canvas" width="640" height="480"></canvas>
<button id="entervr" disabled>Enter VR</button>
<button id="probewebgpuxr" disabled>Probe WebGPU XR</button>
<pre id="log" style="white-space:pre-wrap;font:12px monospace;"></pre>
<script src="webxr_session.js"></script>
<script>
	window.surrealLog = [];
	window.surrealBooted = false;
	window.surrealCrashed = null;
	window.surrealXRSupported = null;
	const surrealBuildDir = new URLSearchParams(location.search).get("build") || "build-emscripten";

	function refreshEnterVRButton() {
		document.getElementById("entervr").disabled =
			!(window.surrealBooted && window.surrealXRSupported);
	}

	const logEl = document.getElementById('log');
	function appendLog(line) {
		window.surrealLog.push(line);
		logEl.textContent += line + "\n";
	}

	var Module = {
		canvas: document.getElementById("canvas"),
		locateFile: function (path) { return "../" + surrealBuildDir + "/" + path; },
		print: appendLog,
		printErr: appendLog,
		onRuntimeInitialized: function () {
			appendLog("[harness] runtime initialized, calling main");
			try {
				const mapName = new URLSearchParams(location.search).get("map") || "DM-Deck16][";
				Module.callMain(["--autoplay", "--url=" + mapName, "--render=webgpu", "/gamedata"]);
				window.surrealBooted = true;
				refreshEnterVRButton();
			} catch (e) {
				window.surrealCrashed = String(e);
				appendLog("[harness] callMain threw: " + e);
				if (e && e.stack) appendLog("[harness] stack: " + e.stack);
			}
		},
	};

	window.addEventListener("error", function (e) {
		var detail = (e.error && e.error.stack) ? e.error.stack : e.message;
		window.surrealCrashed = detail;
		appendLog("[harness] window error: " + detail);
	});
	window.addEventListener("unhandledrejection", function (e) {
		window.surrealCrashed = String(e.reason);
		appendLog("[harness] unhandled rejection: " + e.reason);
	});

	window.surrealGetTickCount = function () {
		return Module.ccall("Surreal_GetTickCount", "number", [], []);
	};
	window.surrealRequestQuit = function () {
		return Module.ccall("Surreal_RequestQuit", null, [], []);
	};
	window.surrealSetXRFrameLoopActive = function (active) {
		return Module.ccall("Surreal_SetXRFrameLoopActive", "number", ["number"], [active ? 1 : 0]);
	};
	window.surrealRunXRFrame = function () {
		return Module.ccall("Surreal_RunXRFrame", "number", [], []);
	};
	window.surrealGetWebGPUErrorCount = function () {
		return Module.ccall("Surreal_GetWebGPUErrorCount", "number", [], []);
	};
	window.surrealGetWebGPUDrawCalls = function () {
		return Module.ccall("Surreal_GetWebGPUDrawCalls", "number", [], []);
	};
	window.surrealGetWebGPUTextureCount = function () {
		return Module.ccall("Surreal_GetWebGPUTextureCount", "number", [], []);
	};
	window.surrealGetWebGPUBindGroupsCreated = function () {
		return Module.ccall("Surreal_GetWebGPUBindGroupsCreated", "number", [], []);
	};
	window.surrealGetWebGPUBindGroupCacheHits = function () {
		return Module.ccall("Surreal_GetWebGPUBindGroupCacheHits", "number", [], []);
	};
	window.surrealGetWebGPUBufferRollovers = function () {
		return Module.ccall("Surreal_GetWebGPUBufferRollovers", "number", [], []);
	};
	window.surrealGetWebGPUExternalRenderTargetFrames = function () {
		return Module.ccall("Surreal_GetWebGPUExternalRenderTargetFrames", "number", [], []);
	};
	window.surrealGetWebGPULastExternalRenderTargetDrawCalls = function () {
		return Module.ccall("Surreal_GetWebGPULastExternalRenderTargetDrawCalls", "number", [], []);
	};
	window.surrealGetWebGPUExternalRenderTargetState = function () {
		return Module.ccall("Surreal_GetWebGPUExternalRenderTargetState", "number", [], []);
	};
	window.surrealQueueWebGPUExternalRenderTarget = function () {
		return Module.ccall("Surreal_QueueWebGPUExternalRenderTarget", "number", [], []);
	};
	window.surrealTestWebGPUExternalStereoFrame = function () {
		return Module.ccall("Surreal_TestWebGPUExternalStereoFrame", "number", [], []);
	};
	window.surrealGetWebAudioState = function () {
		return Module.ccall("Surreal_GetWebAudioState", "number", [], []);
	};
	window.surrealResumeWebAudio = function () {
		return Module.ccall("Surreal_ResumeWebAudio", "number", [], []);
	};
	window.surrealGetWebAudioResumeCount = function () {
		return Module.ccall("Surreal_GetWebAudioResumeCount", "number", [], []);
	};
	window.surrealTestWebGPUTextureImport = function () {
		return Module.ccall("Surreal_TestWebGPUTextureImport", "number", [], []);
	};
	window.surrealVerifyWebGPUTextureImport = async function () {
		const texture = window.surrealWebGPUInteropTestTexture;
		if (!texture) return { matches: false, error: "test texture is missing" };
		let buffer = null;
		try {
			const bytesPerRow = 256;
			buffer = window.surrealWebGPUDevice.createBuffer({
				size: bytesPerRow * 16,
				usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
			});
			const encoder = window.surrealWebGPUDevice.createCommandEncoder();
			encoder.copyTextureToBuffer(
				{ texture: texture },
				{ buffer: buffer, bytesPerRow: bytesPerRow, rowsPerImage: 16 },
				{ width: 16, height: 16, depthOrArrayLayers: 1 });
			window.surrealWebGPUDevice.queue.submit([encoder.finish()]);
			await buffer.mapAsync(GPUMapMode.READ);
			const pixel = Array.from(new Uint8Array(buffer.getMappedRange(), 0, 4));
			const expected = [64, 128, 191, 255];
			const matches = pixel.every((value, i) => Math.abs(value - expected[i]) <= 1);
			return { matches: matches, pixel: pixel, expected: expected };
		} catch (e) {
			return { matches: false, error: e.name + ": " + e.message };
		} finally {
			if (buffer) {
				if (buffer.mapState === "mapped") buffer.unmap();
				buffer.destroy();
			}
			texture.destroy();
			window.surrealWebGPUInteropTestTexture = null;
		}
	};
	window.surrealVerifyWebGPUExternalRenderTarget = async function () {
		const texture = window.surrealWebGPUExternalRenderTarget;
		if (!texture) return { rendered: false, error: "external render target is missing" };
		let buffer = null;
		try {
			const width = 640;
			const height = 480;
			const bytesPerRow = width * 4;
			buffer = window.surrealWebGPUDevice.createBuffer({
				size: bytesPerRow * height,
				usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
			});
			await window.surrealWebGPUDevice.queue.onSubmittedWorkDone();
			const encoder = window.surrealWebGPUDevice.createCommandEncoder();
			encoder.copyTextureToBuffer(
				{ texture: texture, origin: { x: 0, y: 0, z: 1 } },
				{ buffer: buffer, bytesPerRow: bytesPerRow, rowsPerImage: height },
				{ width: width, height: height, depthOrArrayLayers: 1 });
			window.surrealWebGPUDevice.queue.submit([encoder.finish()]);
			await buffer.mapAsync(GPUMapMode.READ);

			const pixels = new Uint8Array(buffer.getMappedRange());
			let nonBlackPixels = 0;
			const sampledColors = new Set();
			for (let offset = 0, pixelIndex = 0; offset < pixels.length; offset += 4, pixelIndex++) {
				if (pixels[offset] || pixels[offset + 1] || pixels[offset + 2]) nonBlackPixels++;
				if (pixelIndex % 257 === 0) {
					sampledColors.add(
						pixels[offset] + "," + pixels[offset + 1] + "," +
						pixels[offset + 2] + "," + pixels[offset + 3]);
				}
			}
			const drawCalls = window.surrealGetWebGPULastExternalRenderTargetDrawCalls();
			return {
				rendered: drawCalls > 0 && nonBlackPixels > 100 && sampledColors.size > 1,
				drawCalls: drawCalls,
				nonBlackPixels: nonBlackPixels,
				distinctSampledColors: sampledColors.size,
				arrayLayer: 1,
			};
		} catch (e) {
			return { rendered: false, error: e.name + ": " + e.message };
		} finally {
			if (buffer) {
				if (buffer.mapState === "mapped") buffer.unmap();
				buffer.destroy();
			}
			texture.destroy();
			window.surrealWebGPUExternalRenderTarget = null;
		}
	};
	window.surrealVerifyWebGPUExternalStereoTarget = async function () {
		const texture = window.surrealWebGPUExternalRenderTarget;
		if (!texture) return { rendered: false, error: "stereo render target is missing" };
		let buffer = null;
		try {
			const width = 640;
			const height = 480;
			const bytesPerRow = width * 4;
			const layerBytes = bytesPerRow * height;
			buffer = window.surrealWebGPUDevice.createBuffer({
				size: layerBytes * 2,
				usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
			});
			await window.surrealWebGPUDevice.queue.onSubmittedWorkDone();
			const encoder = window.surrealWebGPUDevice.createCommandEncoder();
			for (let layer = 0; layer < 2; layer++) {
				encoder.copyTextureToBuffer(
					{ texture: texture, origin: { x: 0, y: 0, z: layer } },
					{ buffer: buffer, offset: layerBytes * layer, bytesPerRow: bytesPerRow, rowsPerImage: height },
					{ width: width, height: height, depthOrArrayLayers: 1 });
			}
			window.surrealWebGPUDevice.queue.submit([encoder.finish()]);
			await buffer.mapAsync(GPUMapMode.READ);

			const pixels = new Uint8Array(buffer.getMappedRange());
			function summarize(base) {
				let nonBlackPixels = 0;
				const sampledColors = new Set();
				for (let pixelIndex = 0, offset = base; pixelIndex < width * height; pixelIndex++, offset += 4) {
					if (pixels[offset] || pixels[offset + 1] || pixels[offset + 2]) nonBlackPixels++;
					if (pixelIndex % 257 === 0) {
						sampledColors.add(pixels[offset] + "," + pixels[offset + 1] + "," + pixels[offset + 2] + "," + pixels[offset + 3]);
					}
				}
				return { nonBlackPixels: nonBlackPixels, distinctSampledColors: sampledColors.size };
			}

			let differentSamples = 0;
			for (let pixelIndex = 0; pixelIndex < width * height; pixelIndex += 257) {
				const left = pixelIndex * 4;
				const right = layerBytes + left;
				if (pixels[left] !== pixels[right] || pixels[left + 1] !== pixels[right + 1] ||
					pixels[left + 2] !== pixels[right + 2] || pixels[left + 3] !== pixels[right + 3]) {
					differentSamples++;
				}
			}
			const left = summarize(0);
			const right = summarize(layerBytes);
			const drawCalls = window.surrealGetWebGPULastExternalRenderTargetDrawCalls();
			return {
				rendered: drawCalls > 0 && left.nonBlackPixels > 100 && right.nonBlackPixels > 100 &&
					left.distinctSampledColors > 1 && right.distinctSampledColors > 1 && differentSamples > 10,
				drawCalls: drawCalls,
				left: left,
				right: right,
				differentSamples: differentSamples,
			};
		} catch (e) {
			return { rendered: false, error: e.name + ": " + e.message };
		} finally {
			if (buffer) {
				if (buffer.mapState === "mapped") buffer.unmap();
				buffer.destroy();
			}
			texture.destroy();
			window.surrealWebGPUExternalRenderTarget = null;
		}
	};

	document.getElementById("entervr").addEventListener("click", function () {
		// Must remain directly inside the trusted gesture. Emscripten OpenAL's
		// AudioContext cannot be resumed from a later promise/RAF callback.
		if (window.surrealBooted && window.surrealResumeWebAudio) {
			window.surrealResumeWebAudio();
		}
		if (window.surrealXRSessionActive) {
			window.surrealXRExit();
		} else {
			window.surrealXREnter();
		}
	});
	document.getElementById("probewebgpuxr").addEventListener("click", function () {
		window.surrealXRProbeWebGPUProjection();
	});

	async function boot() {
		// WebXR capability checks run independent of / before the WebGPU
		// device request below - proves the session-lifecycle plumbing works
		// even if the engine itself fails to boot.
		await window.surrealXRCheckSupport();
		await window.surrealXRCheckGPUCompatible();
		refreshEnterVRButton();

		if (!navigator.gpu) {
			window.surrealCrashed = "navigator.gpu is undefined (no WebGPU support in this browser)";
			appendLog("[harness] " + window.surrealCrashed);
			return;
		}
		// M4: the device actually handed to Emscripten must come from an
		// XR-compatible adapter. A separate successful capability probe does
		// not make a device from a normal adapter compatible with XRGPUBinding.
		const adapter = await navigator.gpu.requestAdapter({ xrCompatible: true });
		if (!adapter) {
			window.surrealCrashed = "navigator.gpu.requestAdapter() resolved null";
			appendLog("[harness] " + window.surrealCrashed);
			return;
		}
		const requiredFeatures = ["texture-compression-bc", "float32-filterable"].filter(f => adapter.features.has(f));
		const device = await adapter.requestDevice({ requiredFeatures });
		window.surrealWebGPUDevice = device;
		device.lost.then(info => appendLog("[harness] WebGPU device lost: " + info.message));
		window.surrealWebGPUErrorCount = 0;
		device.addEventListener("uncapturederror", function (event) {
			window.surrealWebGPUErrorCount++;
			appendLog("[harness] WebGPU uncaptured error: " + event.error.message);
		});
		Module.preinitializedWebGPUDevice = device;
		document.getElementById("probewebgpuxr").disabled = !window.surrealXRGPUBindingAvailable;
		appendLog("[harness] WebGPU device acquired, loading wasm module");
		const script = document.createElement("script");
		script.src = "../" + surrealBuildDir + "/SurrealEngine.js";
		script.onerror = function () {
			window.surrealCrashed = "failed to load SurrealEngine.js";
			appendLog("[harness] " + window.surrealCrashed);
		};
		document.body.appendChild(script);
	}
	boot();
</script>
</body>
</html>
